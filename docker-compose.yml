services:
  app:
    build: .
    container_name: mk_intranet_app
    restart: unless-stopped
    ports:
      - "8081:80"
    environment:
      # Zelfde database als het meldkamersysteem (mkapp) -- geen kopie,
      # deze app leest/schrijft rechtstreeks in dezelfde tabellen.
      DB_HOST: meldkamer_db
      DB_PORT: "3306"
      DB_NAME: mkapp
      DB_USER: phpserver
      DB_PASS: mkappwachtwoord2026
      APP_TIMEZONE: "Europe/Amsterdam"
    networks:
      - meldkamer

# Sluit aan op het BESTAANDE Docker-netwerk van de meldkamerstack, in
# plaats van een eigen (nieuw) netwerk te maken -- zo kan deze container
# de "meldkamer_db"-container gewoon bij naam bereiken.
#
# Naam van dat netwerk verifiëren:
#   docker inspect meldkamer_db --format '{{json .NetworkSettings.Networks}}'
# (of: docker network ls, en zoek het netwerk waar meldkamer_db op draait)
#
# Klopt de standaardwaarde hieronder niet? Zet 'm in een .env-bestand naast
# dit docker-compose.yml, bv.: MELDKAMER_NETWORK=docker_default
networks:
  meldkamer:
    external: true
    name: ${MELDKAMER_NETWORK:-docker_default}
