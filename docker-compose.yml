services:
  app:
    build: .
    container_name: mk_intranet_app
    restart: unless-stopped
    ports:
      - "80:80"
    environment:
      # Testopstelling: database bereikbaar via een vast IP-adres op het
      # netwerk (niet via de lokale Docker-container van de meldkamerstack).
      DB_HOST: 192.168.60.199
      DB_PORT: "3306"
      DB_NAME: mkapp
      DB_USER: phpserver
      DB_PASS: mkappwachtwoord2026
      APP_TIMEZONE: "Europe/Amsterdam"

# Geen extern Docker-netwerk meer nodig: deze container bereikt de database
# nu gewoon via het netwerk (LAN), niet via een gedeelde Docker-container.
# Wil je later weer aansluiten op de meldkamerstack via hetzelfde
# Docker-netwerk (in plaats van een IP-adres)? Zie de eerdere versie in de
# git-historie (V0.0.1) voor die opzet, of vraag het gewoon opnieuw.
